# Production — norcalcarbmobile.com (same as wrangler.jsonc; TOML for CI)
name = "norcal-squarespace-updates-gillis"
main = "worker/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[routes]]
pattern = "norcalcarbmobile.com"
custom_domain = true

[[routes]]
pattern = "www.norcalcarbmobile.com"
custom_domain = true

# Contact form email: Cloudflare Email Workers send_email binding.
# Free sending is limited to verified Email Routing destinations.
# Primary: carb@norcalcarbmobile.com. Fallback: fsu9913@gmail.com.
# Keep in sync with FORM_TO / FORM_TO_FALLBACK in worker/contact.js.
# From is website@norcalcarbmobile.com (must be on the norcalcarbmobile.com zone).
[[send_email]]
name = "EMAIL"
allowed_destination_addresses = ["carb@norcalcarbmobile.com", "fsu9913@gmail.com"]

# OPTIONAL — contact-form lead backup (env.LEADS). Do NOT uncomment with a
# placeholder id; wrangler deploy will fail until a real namespace id is pasted.
#   npx wrangler kv namespace create LEADS
# [[kv_namespaces]]
# binding = "LEADS"
# id = "PASTE_KV_NAMESPACE_ID_HERE"

# CONTACT_TO is no longer read by the Worker (kept in sync with FORM_TO).
[vars]
CONTACT_TO = "carb@norcalcarbmobile.com"
FORM_TO = "carb@norcalcarbmobile.com"
FORM_TO_FALLBACK = "fsu9913@gmail.com"
