# Production name locked. Branch experiment — run_worker_first is a path list.
# Do not merge to main until canary + schema + legacy redirects live in site/ files.
name = "norcal-squarespace-updates-gillis"
main = "worker/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = [ "/api/*", "/contact", "/contact/" ]

[[routes]]
pattern = "norcalcarbmobile.com"
custom_domain = true

[[routes]]
pattern = "www.norcalcarbmobile.com"
custom_domain = true

[vars]
CONTACT_TO = "sales@norcalcarbmobile.com,carb@norcalcarbmobile.com,fsu9913@gmail.com"
