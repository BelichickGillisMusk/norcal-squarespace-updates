# Production — norcalcarbmobile.com (same as wrangler.jsonc; TOML for CI)
name = "norcal-squarespace-updates-gillis"
main = "worker/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[routes]]
pattern = "norcalcarbmobile.com"
custom_domain = true

[[routes]]
pattern = "www.norcalcarbmobile.com"
custom_domain = true

# Contact form email: Cloudflare Email Workers send_email binding.
# Free sending is limited to verified Email Routing destinations. Form leads go to
# bgillis99@gmail.com only (Bryan's 10/16 lock). Keep in sync with FORM_TO in worker/index.js.
[[send_email]]
name = "EMAIL"
allowed_destination_addresses = ["bgillis99@gmail.com"]
