# MONEY SITE ONLY — deploy to empty Cloudflare account (bryan@norcalcarbmobile.com)
# Do NOT use Gillis Institute account (bafa242…). Other brands stay there.
# Do NOT point at *.grok-sandbox.com (Grok Code preview — not production).
#
# Before first deploy:
#   1. Prefer GitHub Actions: secret CF_GROK_KEY_NCM + NORCAL_PROD_CF_ACCOUNT_ID
#      Actions → Deploy NorCal → bryan_go=GO · confirm_worker=norcalcarbmobile-prod
#   2. Or local: export CLOUDFLARE_API_TOKEN=(CF_GROK_KEY_NCM) + account id
#   3. Paste account_id below (empty account only)
#   4. Zone norcalcarbmobile.com must be Active on THIS account
#   5. ./scripts/deploy-norcal-empty-account.sh

name = "norcalcarbmobile-prod"
main = "worker/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# PASTE empty-account Account ID here after bryan@ login (never use bafa242…):
# account_id = "PASTE_EMPTY_ACCOUNT_ID"

[assets]
directory = "./site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[routes]]
pattern = "norcalcarbmobile.com"
custom_domain = true

[[routes]]
pattern = "www.norcalcarbmobile.com"
custom_domain = true

# Contact form email — same EMAIL binding as wrangler.toml / wrangler.jsonc.
# bgillis99@gmail.com MUST be a VERIFIED Email Routing destination on this zone.
# From is website@norcalcarbmobile.com. Keep in sync with FORM_TO in worker/contact.js.
[[send_email]]
name = "EMAIL"
allowed_destination_addresses = ["bgillis99@gmail.com"]

# OPTIONAL — contact-form lead backup (env.LEADS). Do NOT uncomment with a
# placeholder id; wrangler deploy will fail until a real namespace id is pasted.
#   npx wrangler kv namespace create LEADS --config wrangler.prod-empty.toml
# [[kv_namespaces]]
# binding = "LEADS"
# id = "PASTE_KV_NAMESPACE_ID_HERE"

# CONTACT_TO is no longer read by the Worker. Form leads go to bgillis99@gmail.com
# only (Bryan's 10/16 lock) via the send_email binding.
[vars]
CONTACT_TO = "sales@norcalcarbmobile.com,carb@norcalcarbmobile.com,fsu9913@gmail.com"
