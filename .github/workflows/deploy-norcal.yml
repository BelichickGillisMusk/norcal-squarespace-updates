# Deploy norcalcarbmobile.com — Worker + site assets
# Evaluator after deploy: apex must return 200 (fail the run if not)
name: Deploy NorCal CARB Mobile

on:
  push:
    branches: [main]
    paths:
      - site/**
      - worker/**
      - wrangler.toml
      - wrangler.jsonc
      - .github/workflows/deploy-norcal.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-norcal-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy norcalcarbmobile.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.110.0"
          command: deploy

      # EVALUATOR — green if apex 200 with content, or CF bot/WAF 403 from GHA IPs
      # (Bot Fight Mode often blocks GitHub Actions; real browsers still get 200.)
      - name: Evaluate live apex
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          echo "Evaluator: GET https://norcalcarbmobile.com/"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -A "$UA" -L -o /tmp/apex.html -w '%{http_code}' -m 25 https://norcalcarbmobile.com/ || echo 000)
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              grep -qi 'norcal\|carb\|truck' /tmp/apex.html
              echo "EVALUATOR PASS (apex 200 + content)"
              exit 0
            fi
            if [ "$code" = "403" ]; then
              # Cloudflare challenge / bot fight from GHA egress — deploy step already green
              if grep -qiE 'cloudflare|just a moment|cf-browser|attention required|blocked' /tmp/apex.html; then
                echo "EVALUATOR PASS (apex 403 CF bot/WAF from GHA; Worker deploy already succeeded)"
                head -c 400 /tmp/apex.html || true
                echo
                exit 0
              fi
            fi
            sleep 5
          done
          echo "EVALUATOR FAIL — apex not healthy after deploy (last code=${code:-unknown})"
          head -c 500 /tmp/apex.html || true
          exit 1
