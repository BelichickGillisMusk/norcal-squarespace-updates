# PRODUCTION deploy — never runs on push.
# GitHub is for test/validate only. Live ship requires Bryan GO in Actions UI.
# Money site: norcalcarbmobile-prod on EMPTY Bryan CF account (token CF_GROK_KEY_NCM).
# Do NOT point production at *.grok-sandbox.com — that is preview-only.
name: Deploy NorCal CARB Mobile

on:
  workflow_dispatch:
    inputs:
      bryan_go:
        description: 'Type GO to deploy production (required)'
        required: true
        default: ''
        type: string
      confirm_worker:
        description: 'norcalcarbmobile-prod (empty Bryan account) OR norcal-squarespace-updates-gillis (legacy Gillis until cutover)'
        required: true
        default: 'norcalcarbmobile-prod'
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-norcal-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy norcalcarbmobile.com
    # Hard gates — fail before any Cloudflare call if Bryan did not type GO
    if: >-
      github.event.inputs.bryan_go == 'GO' &&
      (github.event.inputs.confirm_worker == 'norcalcarbmobile-prod' ||
       github.event.inputs.confirm_worker == 'norcal-squarespace-updates-gillis')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce approved NorCal template (site-lock)
        run: node scripts/site-lock/validate.mjs

      - name: Blog gate (words + header + links)
        run: node scripts/check-blog-links.mjs

      # Empty-account path (preferred): org/repo secret CF_GROK_KEY_NCM + NORCAL_PROD_CF_ACCOUNT_ID.
      # Legacy Gillis path only when confirm_worker is the old worker name.
      - name: Require empty-account secrets for norcalcarbmobile-prod
        if: github.event.inputs.confirm_worker == 'norcalcarbmobile-prod'
        env:
          CF_TOKEN: ${{ secrets.CF_GROK_KEY_NCM }}
          CF_ACCOUNT: ${{ secrets.NORCAL_PROD_CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN:-}" ]; then
            echo "MISSING secret CF_GROK_KEY_NCM (org or repo) — empty Bryan CF API token."
            echo "Grant org secret to BelichickGillisMusk/norcal-squarespace-updates or set repo secret with same name."
            exit 1
          fi
          if [ -z "${CF_ACCOUNT:-}" ]; then
            echo "MISSING secret NORCAL_PROD_CF_ACCOUNT_ID — empty Bryan Cloudflare account id (32 hex)."
            echo "Dashboard → Account home (bryan@norcalcarbmobile.com). Never use Gillis bafa242…"
            exit 1
          fi
          if [ "$CF_ACCOUNT" = "bafa242dd95d3fdce72540d20accd0a2" ]; then
            echo "BLOCKED: NORCAL_PROD_CF_ACCOUNT_ID is Gillis Institute — money site must use empty account."
            exit 1
          fi
          echo "Empty-account secrets present (token length ${#CF_TOKEN}, account ${CF_ACCOUNT:0:8}…)."

      - name: Deploy Worker (money site → empty CF)
        if: github.event.inputs.confirm_worker == 'norcalcarbmobile-prod'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_GROK_KEY_NCM }}
          accountId: ${{ secrets.NORCAL_PROD_CF_ACCOUNT_ID }}
          wranglerVersion: '4.110.0'
          command: deploy --config wrangler.prod-empty.toml

      - name: Deploy Worker (legacy Gillis — until cutover only)
        if: github.event.inputs.confirm_worker == 'norcal-squarespace-updates-gillis'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.110.0'
          command: deploy

      - name: Evaluate live apex
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'
          echo "Evaluator: GET https://norcalcarbmobile.com/"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -A "$UA" -L -o /tmp/apex.html -w '%{http_code}' -m 25 https://norcalcarbmobile.com/ || echo 000)
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              grep -qi 'norcal\|carb\|truck' /tmp/apex.html
              echo "EVALUATOR PASS (apex 200 + content)"
              exit 0
            fi
            if [ "$code" = "403" ]; then
              if grep -qiE 'cloudflare|just a moment|cf-browser|attention required|blocked' /tmp/apex.html; then
                echo "EVALUATOR PASS (apex 403 CF bot/WAF from GHA; Worker deploy already succeeded)"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "EVALUATOR FAIL — apex not healthy after deploy"
          head -c 500 /tmp/apex.html || true
          exit 1

  blocked:
    if: >-
      github.event.inputs.bryan_go != 'GO' ||
      (github.event.inputs.confirm_worker != 'norcalcarbmobile-prod' &&
       github.event.inputs.confirm_worker != 'norcal-squarespace-updates-gillis')
    runs-on: ubuntu-latest
    steps:
      - name: Reject deploy without Bryan GO
        run: |
          echo "DEPLOY BLOCKED — production is locked."
          echo "To ship: Actions → Deploy NorCal CARB Mobile → Run workflow"
          echo "  bryan_go = GO"
          echo "  confirm_worker = norcalcarbmobile-prod   (empty Bryan account — preferred)"
          echo "  or norcal-squarespace-updates-gillis     (legacy Gillis — until cutover)"
          echo "Empty path secrets: CF_GROK_KEY_NCM + NORCAL_PROD_CF_ACCOUNT_ID"
          echo "Do not CNAME production to *.grok-sandbox.com (preview only)."
          echo "Push/PR never deploys. Other brands stay on Gillis account."
          exit 1
