# One-off, idempotent fix for the known email blocker (see change_log.md 2026-08-03):
# adds the missing Resend/SES SPF TXT record at send.mail.norcalcarbmobile.com.
# Reuses the existing CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets already
# used by deploy-worker.yml/deploy-norcal.yml. Only ever creates the one record if
# it's absent — never touches any other DNS record.
name: Fix Resend SPF DNS (send.mail TXT)

# workflow_dispatch alone can't be API-triggered until this file is on the
# default branch, so also run on push to this specific branch (idempotent —
# safe to re-run; only creates the record if it's still missing).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/norcalcarbmobile-email-dns-gcr8ur
    paths:
      - .github/workflows/cloudflare-dns-fix-resend-spf.yml

permissions:
  contents: read

jobs:
  add-spf-record:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure send.mail SPF TXT record exists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          DOMAIN="norcalcarbmobile.com"
          RECORD_NAME="send.mail.${DOMAIN}"
          SPF_VALUE="v=spf1 include:amazonses.com ~all"

          zone_json=$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}")

          if [ "$(echo "$zone_json" | jq -r '.success')" != "true" ]; then
            echo "::error::Zone lookup failed: $(echo "$zone_json" | jq -c '.errors')"
            exit 1
          fi

          zone_id=$(echo "$zone_json" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo "::error::No zone found for ${DOMAIN} on this token's account (check Zone:Read scope)."
            exit 1
          fi
          echo "Resolved zone for ${DOMAIN}."

          existing_json=$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=TXT&name=${RECORD_NAME}")

          if [ "$(echo "$existing_json" | jq -r '.success')" != "true" ]; then
            echo "::error::DNS record lookup failed: $(echo "$existing_json" | jq -c '.errors')"
            exit 1
          fi

          existing_count=$(echo "$existing_json" | jq -r '.result | length')
          if [ "$existing_count" -gt 0 ]; then
            echo "Record already exists — not modifying anything:"
            echo "$existing_json" | jq -c '.result[] | {id, name, content}'
            exit 0
          fi

          echo "No existing ${RECORD_NAME} TXT record found. Creating it..."
          payload=$(jq -n --arg name "$RECORD_NAME" --arg content "$SPF_VALUE" \
            '{type:"TXT", name:$name, content:$content, ttl:1}')

          create_json=$(curl -sS -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
            --data "$payload")

          if [ "$(echo "$create_json" | jq -r '.success')" != "true" ]; then
            echo "::error::Record creation failed: $(echo "$create_json" | jq -c '.errors')"
            exit 1
          fi

          echo "Created record:"
          echo "$create_json" | jq -c '.result | {id, name, content}'
