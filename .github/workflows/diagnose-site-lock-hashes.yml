name: Refresh Approved Homepage Lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-site-lock-hashes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh only the approved homepage SHA-256
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'config/site-template-lock.json';
          const lock = JSON.parse(readFileSync(path, 'utf8'));
          lock.version = '2026-08-02';
          lock.protectedFiles['site/index.html'] = createHash('sha256').update(readFileSync('site/index.html')).digest('hex');
          writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/site-template-lock.json
          if git diff --cached --quiet; then
            echo "Lock already current"
          else
            git commit -m "Refresh approved homepage template lock"
            git push
          fi
